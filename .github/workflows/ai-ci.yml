name: AI CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .
          GEMINI_KEY: dummy-key-for-ci

  deploy:
    name: Deploy AI service to Coolify
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "⚠️ COOLIFY_AI_DEPLOY_WEBHOOK secret is not set. Skipping deploy."
            exit 0
          fi
          echo "🚀 Triggering Coolify redeploy for AI service..."
          curl --fail --show-error --silent --request POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
          echo ""
          echo "✅ Deploy triggered successfully!"
