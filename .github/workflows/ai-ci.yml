name: AI CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ai-ci:
    name: Test AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .
