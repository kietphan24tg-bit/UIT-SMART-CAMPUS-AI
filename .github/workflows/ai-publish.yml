name: Build, Test, Publish AI Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: kietphan24/smart-campus-ai
  STAGING_TAG: staging
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
  COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

jobs:
  staging:
    name: Build, Test, Publish AI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)
        shell: bash

      - name: Validate deploy configuration
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL or COOLIFY_DEPLOY_WEBHOOK"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -n "$COOLIFY_DEPLOY_WEBHOOK" ] && [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "Missing COOLIFY_API_TOKEN"
            exit 1
          fi
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
        shell: bash

      - name: Trigger Coolify deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' && env.COOLIFY_DEPLOY_WEBHOOK != '' }}
        run: |
          curl --fail --show-error --silent --request POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK"
        shell: bash

      - name: Explain deploy output
        run: |
          echo "Published image:"
          echo "- ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}"
          echo "- ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}"
        shell: bash
