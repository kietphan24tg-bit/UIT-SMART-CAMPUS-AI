name: Build, Test, Publish AI Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: kietphan24/smart-campus-ai
  STAGING_TAG: staging
  RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
  COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
  AI_ADMIN_TOKEN: ${{ secrets.AI_ADMIN_TOKEN }}
  GROQ_KEY: ${{ secrets.GROQ_KEY }}

jobs:
  staging:
    name: Build, Test, Publish AI Image
    if: ${{ github.repository == 'kietphan24tg-bit/UIT-SMART-CAMPUS-AI' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: >-
          pytest -q
          tests/test_agent_*.py
          tests/test_chunking.py
          tests/test_documents_loader.py
          tests/test_guardrails.py
          tests/test_hybrid_retriever.py
          tests/test_main.py
          tests/test_pgvector_store.py
          tests/test_pipeline.py
          tests/test_rag_service.py
          tests/test_retrieval.py
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          GEMINI_API_KEY: ci-test-key
          AI_SERVICE_TOKEN: ci-test-token

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN" && exit 1)
        shell: bash

      - name: Validate deploy configuration
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL or COOLIFY_DEPLOY_WEBHOOK"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -n "$COOLIFY_DEPLOY_WEBHOOK" ] && [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "Missing COOLIFY_API_TOKEN"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -n "$COOLIFY_DEPLOY_WEBHOOK" ] && [ -z "$AI_ADMIN_TOKEN" ]; then
            echo "Missing AI_ADMIN_TOKEN"
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] && [ -n "$COOLIFY_DEPLOY_WEBHOOK" ] && [ -z "$GROQ_KEY" ]; then
            echo "Missing GROQ_KEY"
            exit 1
          fi
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
        shell: bash

      - name: Configure AI secrets in Coolify
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' && env.COOLIFY_DEPLOY_WEBHOOK != '' }}
        run: |
          COOLIFY_BASE_URL="$(python -c 'import sys; from urllib.parse import urlsplit; value=urlsplit(sys.argv[1]); print(f"{value.scheme}://{value.netloc}")' "$COOLIFY_DEPLOY_WEBHOOK")"
          COOLIFY_APP_UUID="$(python -c 'import sys; from urllib.parse import parse_qs, urlsplit; print(parse_qs(urlsplit(sys.argv[1]).query).get("uuid", [""])[0])' "$COOLIFY_DEPLOY_WEBHOOK")"
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_APP_UUID"

          ENVS_FILE="$(mktemp)"
          trap 'rm -f "$ENVS_FILE"' EXIT
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
            --output "$ENVS_FILE"

          upsert_env() {
            local key="$1"
            local value="$2"
            local payload
            local method

            payload="$(jq -nc --arg key "$key" --arg value "$value" '{key:$key,value:$value,is_preview:false,is_literal:true,is_shown_once:true}')"
            if jq -e --arg key "$key" '.[]? | select(.key == $key)' "$ENVS_FILE" >/dev/null; then
              method=PATCH
            else
              method=POST
            fi
            curl --fail --show-error --silent --request "$method" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
              >/dev/null
          }

          upsert_env "AI_ADMIN_TOKEN" "$AI_ADMIN_TOKEN"
          upsert_env "GROQ_KEY" "$GROQ_KEY"

          IMAGE_PAYLOAD="$(jq -nc \
            --arg name "$IMAGE_NAME" \
            --arg tag "$STAGING_TAG" \
            '{docker_registry_image_name:$name,docker_registry_image_tag:$tag}')"
          curl --fail --show-error --silent --request PATCH \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$IMAGE_PAYLOAD" \
            "$COOLIFY_BASE_URL/api/v1/applications/$COOLIFY_APP_UUID" \
            >/dev/null
        shell: bash

      - name: Trigger Coolify deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' && env.COOLIFY_DEPLOY_WEBHOOK != '' }}
        run: |
          COOLIFY_BASE_URL="$(python -c 'import sys; from urllib.parse import urlsplit; value=urlsplit(sys.argv[1]); print(f"{value.scheme}://{value.netloc}")' "$COOLIFY_DEPLOY_WEBHOOK")"
          COOLIFY_APP_UUID="$(python -c 'import sys; from urllib.parse import parse_qs, urlsplit; print(parse_qs(urlsplit(sys.argv[1]).query).get("uuid", [""])[0])' "$COOLIFY_DEPLOY_WEBHOOK")"
          test -n "$COOLIFY_BASE_URL"
          test -n "$COOLIFY_APP_UUID"

          DEPLOY_RESPONSE="$(mktemp)"
          DEPLOY_STATUS="$(mktemp)"
          trap 'rm -f "$DEPLOY_RESPONSE" "$DEPLOY_STATUS"' EXIT

          curl --fail --show-error --silent --request POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Accept: application/json" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true" \
            --output "$DEPLOY_RESPONSE"

          DEPLOYMENT_UUID="$(jq -er '.deployments[0].deployment_uuid' "$DEPLOY_RESPONSE")"
          echo "Coolify deployment queued: $DEPLOYMENT_UUID"

          for attempt in $(seq 1 60); do
            curl --fail --show-error --silent \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Accept: application/json" \
              "$COOLIFY_BASE_URL/api/v1/deployments/$DEPLOYMENT_UUID" \
              --output "$DEPLOY_STATUS"

            STATUS="$(jq -r '.status // "unknown"' "$DEPLOY_STATUS")"
            echo "Coolify deployment status ($attempt/60): $STATUS"
            case "$STATUS" in
              finished)
                exit 0
                ;;
              failed|cancelled|cancelled-by-user|error)
                jq '{status, updated_at}' "$DEPLOY_STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for Coolify deployment"
          exit 1
        shell: bash

      - name: Explain deploy output
        run: |
          echo "Published image:"
          echo "- ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}"
          echo "- ${{ env.IMAGE_NAME }}:staging-${{ steps.meta.outputs.short_sha }}"
        shell: bash
