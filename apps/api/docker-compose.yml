services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campus-db
    restart: unless-stopped
    ports:
      - "65432:5432"
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus_dev
      POSTGRES_DB: smart_campus
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: smart-campus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: smartcampus
      MINIO_ROOT_PASSWORD: smartcampus_minio_dev
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: smart-campus-minio-bootstrap
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 smartcampus smartcampus_minio_dev) do echo 'waiting for minio'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/smart-campus-assets;
      /usr/bin/mc anonymous set download local/smart-campus-assets;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
