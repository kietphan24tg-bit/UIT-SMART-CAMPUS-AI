appId: vn.edu.uit.smartcampus
name: Login - Dang nhap thanh cong
---
- launchApp:
    clearState: true

- assertVisible: 'Smart Campus'
- assertVisible: 'Hello!'
- assertVisible: 'Email sinh viên'

- tapOn: 'student@gm.uit.edu.vn'
- inputText: 'student@gm.uit.edu.vn'

- tapOn: 'Nhập mật khẩu'
- inputText: 'Password123'

- tapOn: 'Đăng nhập'

- assertVisible:
    text: 'Trang chủ'
    timeout: 5000
