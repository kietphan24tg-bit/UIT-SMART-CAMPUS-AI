appId: vn.edu.uit.smartcampus
name: Login - Hien thi loi khi sai thong tin
---
- launchApp:
    clearState: true

- assertVisible: 'Smart Campus'
- assertVisible: 'Hello!'

- tapOn: 'student@gm.uit.edu.vn'
- inputText: 'student@gm.uit.edu.vn'

- tapOn: 'Nhập mật khẩu'
- inputText: 'wrongpass'

- tapOn: 'Đăng nhập'
- assertVisible: 'Email hoặc mật khẩu chưa đúng.'
