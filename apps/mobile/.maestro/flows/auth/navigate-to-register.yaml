appId: vn.edu.uit.smartcampus
name: Auth - Chuyen giua Login va Register
---
- launchApp:
    clearState: true

- assertVisible: 'Smart Campus'
- assertVisible: 'Đăng ký tại đây'

# Chuyen sang man hinh dang ky
- tapOn: 'Đăng ký tại đây'
- assertVisible: 'Tạo tài khoản'
- assertVisible: 'Đã có tài khoản?'

# Quay lai man hinh dang nhap
- tapOn: 'Đăng nhập'
- assertVisible: 'Hello!'
