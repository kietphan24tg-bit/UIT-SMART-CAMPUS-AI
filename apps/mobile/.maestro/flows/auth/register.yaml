appId: vn.edu.uit.smartcampus
name: Register - Dang ky tai khoan
---
- launchApp:
    clearState: true

- tapOn: 'Đăng ký tại đây'

- assertVisible: 'Tạo tài khoản'

- tapOn: 'Nguyễn'
- inputText: 'Nguyen Van'

- tapOn: 'Văn A'
- inputText: 'Test'

- tapOn: '22520001'
- inputText: '22529999'

- tapOn: 'student@gm.uit.edu.vn'
- inputText: 'test.e2e@gm.uit.edu.vn'

- tapOn: 'Ít nhất 8 ký tự'
- inputText: 'TestPass123'

- tapOn: 'Nhập lại mật khẩu'
- inputText: 'TestPass123'

- tapOn: 'Tạo tài khoản'

- assertVisible:
    text: 'Trang chủ'
    timeout: 5000
