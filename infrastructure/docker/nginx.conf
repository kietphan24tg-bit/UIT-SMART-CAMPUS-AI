upstream api {
    server api:3000;
}

# Public OTP endpoints need an edge limit in addition to per-email/per-challenge
# limits in the API. Tune these values with real campus NAT traffic before launch.
limit_req_zone $binary_remote_addr zone=otp_delivery_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=otp_verify_per_ip:10m rate=60r/m;

server {
    listen 80;
    server_name api.smartcampus.uit.edu.vn;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.smartcampus.uit.edu.vn;

    # SSL certificates (Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.smartcampus.uit.edu.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.smartcampus.uit.edu.vn/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_req_status 429;

    # Sending an OTP invokes SMTP and is more expensive than ordinary API traffic.
    location ~ ^/api/v1/auth/(register(?:/resend)?|password-reset/request)$ {
        limit_req zone=otp_delivery_per_ip burst=15 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Verification performs a bounded bcrypt comparison. Limit request bursts
    # before they reach Node so a single source cannot amplify CPU work.
    location ~ ^/api/v1/auth/(register/verify|password-reset/(verify|reset))$ {
        limit_req zone=otp_verify_per_ip burst=30 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    # Proxy settings
    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Max upload size
    client_max_body_size 10M;
}
